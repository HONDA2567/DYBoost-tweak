name: build-dyboost

# 没 Mac 时的白嫖路径：把仓库推到 GitHub -> Actions 跑完 -> 下载 deb / dylib -> 巨魔注入器导入。
#
# 巨魔注入器(TrollFools) 只需要一个 .dylib；deb 只是容器，图省事可以直接把
# 产物里的 DYBoost.deb 丢给 TrollFools（它会自己解出里面的 dylib）。
on:
  workflow_dispatch:
    inputs:
      scheme:
        description: 'deb 布局（巨魔选 trollstore）'
        required: false
        default: 'trollstore'
        type: choice
        options: [trollstore, rootless, roothide, rootful]
      make_release:
        description: '顺便发一个 Release（手机可直接下载）'
        required: false
        default: false
        type: boolean
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version

      - name: 编译三个变体 (arm64 + arm64e, ad-hoc 签名)
        working-directory: DYBoost
        run: |
          set -e
          python3 tools/build.py --min 15.0 --arch arm64,arm64e --pack none
          python3 tools/build.py --min 15.0 --arch arm64,arm64e --stage-default 1 --suffix=-lite --pack none
          python3 tools/build.py --min 15.0 --arch arm64,arm64e --probe --suffix=-probe --pack none
          echo "=== 签名校验 ==="
          for f in packages/DYBoost.dylib packages/DYBoost-lite.dylib packages/DYBoost-probe.dylib; do
            lipo -info "$f"
            codesign -dv "$f" 2>&1 | head -3 || echo "$f 未签名"
          done
          ls -la packages/

      - name: 产物自检（架构 / 入口 / 依赖 / 签名）
        working-directory: DYBoost
        run: |
          python3 tools/verify_dylib.py packages/DYBoost.dylib
          python3 tools/verify_dylib.py packages/DYBoost-lite.dylib

      - name: 打 deb / zip
        working-directory: DYBoost
        run: |
          python3 tools/pack_deb.py \
            --dylib packages/DYBoost.dylib \
            --scheme "${{ github.event.inputs.scheme || 'trollstore' }}" \
            --out packages --format all
          ls -la packages/

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DYBoost-dylib-deb-zip
          path: |
            DYBoost/packages/*.dylib
            DYBoost/packages/*.deb
            DYBoost/packages/*.zip
          if-no-files-found: error

      - name: 发 Release（可选）
        if: ${{ github.event.inputs.make_release == 'true' || startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          # 手动触发时 ref_name 是分支名，不适合当 tag，用 run_id 造一个
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: DYBoost build ${{ github.run_number }}
          body: |
            抖音增强 + 美化插件 DYBoost 编译产物。

            - `DYBoost.dylib`  —— 巨魔注入器(TrollFools) 直接注入这个
            - `DYBoost*.deb`   —— 也可直接喂给 TrollFools / 越狱后 dpkg 安装
            - `DYBoost*.zip`   —— 上面两个的压缩包

            注入后彻底杀掉抖音后台再打开。
          files: |
            DYBoost/packages/*.dylib
            DYBoost/packages/*.deb
            DYBoost/packages/*.zip
